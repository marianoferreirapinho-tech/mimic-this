<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mimic This!</title><style>
:root{--p:#7b22f6;--y:#ffd91a;--t:#10d7df;--n:#10233a;--pink:#ff3b91}*{box-sizing:border-box}body{margin:0;background:#081729;color:#fff;font-family:Inter,system-ui,sans-serif}#app{min-height:100vh;display:grid;place-items:center}.phone{width:min(390px,100vw);height:min(844px,100vh);background:linear-gradient(#10233a,#0d1d31);overflow:hidden;position:relative}.screen{height:100%;overflow:auto;padding-bottom:70px}.top{min-height:78px;padding:23px 18px 12px;background:linear-gradient(135deg,#6f20ef,#922aff);display:flex;align-items:center;justify-content:space-between;font-weight:900}.brand{font-size:27px;font-weight:1000;line-height:.8;transform:rotate(-3deg);text-shadow:2px 3px #241066}.brand b{color:var(--y)}.content{padding:18px}.btn{width:100%;border:0;border-radius:13px;padding:15px;font-weight:900;font-size:16px;background:var(--t);color:#fff;margin-top:12px}.card{background:linear-gradient(145deg,#2c4a6b,#203a59);border-radius:16px;padding:14px;margin:10px 0}.muted{color:#afc0d4;font-size:12px}.section{font-size:19px;font-weight:900;margin-top:18px}.input{width:100%;border:0;border-radius:12px;padding:13px;margin:6px 0;background:#fff;color:#10233a;font-weight:700}.cats{display:grid;gap:10px}.cat{height:82px;border-radius:14px;padding:14px;display:flex;gap:12px;align-items:center;font-weight:900;border:3px solid transparent}.cat.sel{border-color:white}.movies{background:linear-gradient(135deg,#7e26ef,#a12eff)}.people{background:linear-gradient(135deg,#ffd31b,#ffe74d);color:#10233a}.custom{background:linear-gradient(135deg,#0ed6df,#19e6ec);color:#10233a}.splash{height:100%;background:linear-gradient(145deg,#7a21f4,#9428ff);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;position:relative;overflow:hidden}.splash .big{font-size:64px;font-weight:1000;line-height:.78;letter-spacing:-4px;text-shadow:4px 5px #25116b}.splash .big b{color:var(--y)}.splash .tag{margin-top:45px;font-weight:1000}.faces{font-size:70px;position:absolute;bottom:20px}.login{text-align:center;padding:70px 20px}.social{width:100%;padding:13px;border:0;border-radius:12px;margin:6px 0;background:#fff;font-weight:800}.role{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:25px}.actor{background:#ffda1c;color:#111}.team{background:#0fd4df}.opp{background:#ff3b91}.word{background:#fff8dd;color:#111;border-radius:12px;padding:12px 25px;margin:14px;font-size:30px;font-weight:1000}.video{height:100%;background:radial-gradient(circle,#5c6670,#182535 58%,#080f17);display:flex;align-items:center;justify-content:center;position:relative}.person{font-size:120px}.reacts{position:absolute;bottom:25px;left:12px;right:12px;background:#07121dcc;border-radius:999px;padding:10px;display:flex;justify-content:space-around;font-size:27px}.watchonly{position:absolute;bottom:25px;left:20px;right:20px;background:#07121dcc;padding:12px;border-radius:12px}.vote{display:flex;gap:8px;align-items:center}.vote .card{flex:1}.vote button{border:0;border-radius:10px;padding:10px;background:#1677e8;color:white;font-weight:900}.vote button.on{background:var(--t);color:#10233a}
</style></head><body><div id="app"><div class="phone" id="phone"></div></div><script src="/socket.io/socket.io.js"></script><script>
const socket=io(),S={screen:"splash",game:null,playerId:localStorage.playerId||null,gameId:localStorage.gameId||null,category:"movies"};const phone=document.getElementById("phone");const brand='<div class="brand">MIMIC<br><b>THIS!</b></div>';
socket.on("game:update",g=>{if(g.me?.id===S.playerId){S.game=g;if(!["home","create"].includes(S.screen))route();render()}});if(S.gameId&&S.playerId)socket.emit("game:resume",{gameId:S.gameId,playerId:S.playerId});
function go(x){S.screen=x;render()}function save(x){S.gameId=x.gameId;S.playerId=x.playerId;localStorage.gameId=x.gameId;localStorage.playerId=x.playerId}function head(t){return '<div class="top"><span onclick="go(\'home\')" style="font-size:28px">‹</span><b>'+t+'</b><span>⚙</span></div>'}function route(){if(!S.game)return;let s=S.game.status;S.screen=s==="lobby"?"lobby":s==="role"?"role":s==="reveal"?"reveal":s==="guess"&&S.game.permissions.guess?"guess":"watch"}
function render(){if(S.screen==="splash"){phone.innerHTML='<div class="splash" onclick="go(\'login\')"><div class="big">MIMIC<br><b>THIS!</b></div><div class="tag">ACT • WATCH • GUESS • LAUGH</div><div class="faces">🩵 😆 ⭐</div></div>';return}if(S.screen==="login"){phone.innerHTML='<div class="login">'+brand+'<h3>Play with friends.<br>Anytime. Anywhere.</h3><input id="name" class="input" value="Mariano"><button class="social" onclick="go(\'home\')">🌈 Continue</button><button class="social" onclick="go(\'join\')">🔗 Join with Game Code</button></div>';return}if(S.screen==="join"){phone.innerHTML='<div class="screen">'+head("Join Game")+'<div class="content"><input id="jn" class="input" placeholder="Your name"><input id="jc" class="input" placeholder="Game code"><button class="btn" onclick="join()">Join Game</button></div></div>';return}if(S.screen==="home"){phone.innerHTML='<div class="screen"><div class="top"><span>🙂</span>'+brand+'<span>⚙</span></div><div class="content"><button class="btn" onclick="go(\'create\')">＋ NEW GAME</button><div class="section">My Games</div>'+(S.game?'<div class="card" onclick="route();render()"><h3>'+S.game.name+'</h3><div class="muted">'+S.game.players.map(p=>p.name).join(", ")+'</div><b>'+S.game.status.toUpperCase()+'</b></div>':'<div class="card">Create a game or join with a code.</div>')+'</div></div>';return}if(S.screen==="create"){phone.innerHTML='<div class="screen">'+head("Create Game")+'<div class="content"><h2>Choose a Category</h2><div class="cats"><div class="cat movies '+(S.category==="movies"?"sel":"")+'" onclick="S.category=\'movies\';render()">🎬 <b>Movies</b></div><div class="cat people '+(S.category==="people"?"sel":"")+'" onclick="S.category=\'people\';render()">⭐ <b>Famous People</b></div><div class="cat custom '+(S.category==="custom"?"sel":"")+'" onclick="S.category=\'custom\';render()">👥 <b>Custom</b></div></div>'+(S.category==="custom"?'<input id="catname" class="input" value="People We Know">':'')+'<h3>Guessing Time</h3><select id="time" class="input"><option>30 seconds</option><option>1 minute</option><option selected>5 minutes</option><option>15 minutes</option><option>30 minutes</option><option>1 hour</option></select><h3>Invite People</h3><input id="invites" class="input" value="Sarah, John, Maria"><button class="btn" onclick="create()">Create Game</button></div></div>';return}if(S.screen==="lobby"){let g=S.game;phone.innerHTML='<div class="screen">'+head("Game Lobby")+'<div class="content"><div class="card"><h3>'+g.name+'</h3>Code: <b>'+g.code+'</b></div>'+g.players.map(p=>'<div class="card">'+(p.team==="blue"?"🔵":"🟣")+' '+p.name+' <span style="float:right">'+(p.connected?"🟢":"⚪")+'</span></div>').join("")+'<button class="btn" onclick="socket.emit(\'game:start\',{gameId:S.gameId})">Start Game</button></div></div>';return}if(S.screen==="role"){let g=S.game,p=g.permissions,cl=p.record?"actor":p.guess?"team":"opp";phone.innerHTML='<div class="role '+cl+'">'+brand+'<h1>'+(p.record?"YOU ARE THE ACTOR!":p.guess?"GUESS THE "+g.categoryName.toUpperCase():"ENJOY!")+'</h1>'+(p.knowWord?'<div>The word is:</div><div class="word">'+g.turn.word+'</div>':'<p>Watch your teammate and figure out the word.<br><b>You do NOT know the word.</b></p>')+(p.record?'<p>🚫 No talking &nbsp; 🚫 No sounds &nbsp; 🚫 No writing</p><button class="btn" onclick="socket.emit(\'turn:recorded\',{gameId:S.gameId,videoLabel:\'Video 1\'})">Start / Finish Recording</button>':'<button class="btn" onclick="go(\'watch\')">Continue</button>')+'</div>';return}if(S.screen==="watch"){let g=S.game;phone.innerHTML='<div class="video"><div class="person">💃</div>'+(g.permissions.react?'<div class="reacts">'+["😂","❤️","👏","🔥","😲"].map(e=>'<span onclick="socket.emit(\'reaction:add\',{gameId:S.gameId,playerId:S.playerId,emoji:\''+e+'\'})">'+e+'</span>').join("")+'</div>':'<div class="watchonly">You’re the actor — watch only. No reactions or voting.</div>')+(g.permissions.guess?'<button class="btn" style="position:absolute;top:20px;right:15px;width:auto" onclick="go(\'guess\')">Guess ›</button>':'<button class="btn" style="position:absolute;top:20px;right:15px;width:auto" onclick="socket.emit(\'turn:reveal\',{gameId:S.gameId})">Reveal ›</button>')+'</div>';return}if(S.screen==="guess"){let g=S.game,vals=["Mom","Grandma","Aunt Lisa"];phone.innerHTML='<div class="screen">'+head("Team Blue — Guess Now")+'<div class="content">'+vals.map(v=>'<div class="vote"><div class="card"><b>'+v+'</b></div><button class="'+(g.turn.guesses[S.playerId]===v?"on":"")+'" onclick="socket.emit(\'guess:vote\',{gameId:S.gameId,playerId:S.playerId,answer:\''+v+'\'})">'+(g.turn.guesses[S.playerId]===v?"✓ Your vote":"👍 Vote")+'</button></div>').join("")+'<input id="newguess" class="input" placeholder="Add a different guess"><button class="btn" onclick="socket.emit(\'guess:vote\',{gameId:S.gameId,playerId:S.playerId,answer:document.getElementById(\'newguess\').value})">Use my one vote</button><div class="muted">One vote per player. A new choice moves your existing vote.</div><button class="btn" onclick="socket.emit(\'turn:reveal\',{gameId:S.gameId})">Reveal Answer</button></div></div>';return}if(S.screen==="reveal"){let g=S.game,ok=(g.turn.finalAnswer||"").toLowerCase()===(g.turn.word||"").toLowerCase();phone.innerHTML='<div class="screen">'+head("Round "+g.turn.number)+'<div class="content" style="text-align:center"><h3>THE WORD WAS</h3><div class="word">'+g.turn.word+'</div><h2>'+g.turn.finalAnswer+'</h2><h2>'+(ok?"✓ CORRECT!":"NOT THIS TIME")+'</h2><h2>Blue '+g.scores.blue+' · '+g.scores.purple+' Purple</h2><button class="btn" onclick="socket.emit(\'turn:next\',{gameId:S.gameId})">Next Turn</button></div></div>';return}}
function create(){let invites=document.getElementById("invites").value.split(",").map(x=>x.trim()).filter(Boolean),categoryName=S.category==="custom"?(document.getElementById("catname")?.value||"Custom"):S.category==="movies"?"Movies":"Famous People";socket.emit("game:create",{name:categoryName+" Game",playerName:"Mariano",category:S.category,categoryName,guessingTime:document.getElementById("time").value,invitees:invites},save)}function join(){socket.emit("game:join",{code:document.getElementById("jc").value,name:document.getElementById("jn").value||"Player"},x=>{if(x.error)return alert(x.error);save(x)})}render();
</script></body></html>
