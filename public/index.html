<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mimic This!</title><style>
:root{--p:#7b22f6;--y:#ffd91a;--t:#10d7df;--n:#10233a;--pink:#ff3b91}*{box-sizing:border-box}body{margin:0;background:#081729;color:#fff;font-family:Inter,system-ui,sans-serif}#app{min-height:100vh;display:grid;place-items:center}.phone{width:min(390px,100vw);height:min(844px,100vh);background:linear-gradient(#10233a,#0d1d31);overflow:hidden;position:relative}.screen{height:100%;overflow:auto;padding-bottom:70px}.top{min-height:78px;padding:23px 18px 12px;background:linear-gradient(135deg,#8a2bf7,#6f20ef);display:flex;align-items:center;justify-content:space-between;font-weight:900}.brand{font-size:27px;font-weight:1000;line-height:.8;transform:rotate(-3deg);text-shadow:2px 3px #241066}.brand b{color:var(--y)}.content{padding:18px}.btn{width:100%;border:0;border-radius:13px;padding:15px;font-weight:900;font-size:16px;background:var(--t);color:#fff;margin-top:12px}.card{background:linear-gradient(145deg,#294765,#213c59);border-radius:14px;padding:14px;margin:10px 0}.muted{color:#afc0d4;font-size:12px}.section{font-size:19px;font-weight:900;margin-top:18px}.input{width:100%;border:0;border-radius:12px;padding:13px;margin:6px 0;background:#fff;color:#10233a;font-weight:700}.cats{display:grid;gap:10px}.cat{height:82px;border-radius:14px;padding:14px;display:flex;gap:12px;align-items:center;font-weight:900;border:3px solid transparent}.cat.sel{border-color:white}.movies{background:linear-gradient(135deg,#7e26ef,#a12eff)}.people{background:linear-gradient(135deg,#ffd31b,#ffe74d);color:#fff;text-shadow:0 1px 2px #0005}.custom{background:linear-gradient(135deg,#0ed6df,#19e6ec);color:#fff;text-shadow:0 1px 2px #0005}.splash{height:100%;background:radial-gradient(circle at 10% 0,#a23cff 0 12%,transparent 13%),linear-gradient(145deg,#7924f5,#8f20ff 60%,#7219ef);display:flex;flex-direction:column;align-items:center;text-align:center;cursor:pointer;position:relative;overflow:hidden;padding-top:100px}.splash .big{font-family:"Arial Rounded MT Bold","Trebuchet MS",sans-serif;font-size:65px;font-weight:1000;line-height:.78;letter-spacing:-5px;color:white;-webkit-text-stroke:7px #28116c;paint-order:stroke fill;transform:rotate(-4deg);filter:drop-shadow(0 7px 0 #29106e)}.splash .big b{color:var(--y)}.splash .tag{margin-top:78px;font-weight:1000}.faces{font-size:70px;position:absolute;bottom:20px}.login{text-align:center;padding:64px 20px;background:linear-gradient(180deg,#122944,#0d2239);height:100%}.social{width:100%;padding:13px;border:0;border-radius:12px;margin:6px 0;background:#fff;color:#111;font-weight:800;box-shadow:0 2px 3px #0002}.role{height:100%;display:flex;flex-direction:column;align-items:center;text-align:center;padding:14px 18px 18px;position:relative;overflow:hidden}.actor{background:linear-gradient(155deg,#8e2df7,#651ee3);color:#fff}.team{background:linear-gradient(160deg,#13dce8,#08c8df)}.opp{background:linear-gradient(160deg,#ff3d9a,#ff2182)}.role .brand{font-size:32px;margin:4px 0 14px}.roleClose{position:absolute;left:13px;top:12px;font-size:24px}.avatar{width:78px;height:78px;border-radius:50%;border:4px solid #fff;background:#f4e1cf;display:grid;place-items:center;font-size:48px;box-shadow:0 2px 8px #0003}.role h1{font-size:21px;margin:10px 0 3px}.actor .word{width:100%;margin:4px 0 10px;font-size:29px}.wordlabel{font-size:12px;font-weight:800}.only{font-weight:900;margin:0 0 8px}.acticons,.noicons{width:100%;display:flex;justify-content:space-around;gap:7px}.acticons div,.noicons div{flex:1;font-size:11px;font-weight:800}.ico{display:block;font-size:27px;margin-bottom:3px}.noicons{margin-top:13px}.actor .btn{margin-top:auto;background:#11d6df}.actor .word{color:#111;text-shadow:none}.clapper{position:absolute;right:24px;top:70px;font-size:46px;transform:rotate(-12deg)}.team h1,.opp h1{font-size:28px}.team .word,.opp .word{font-size:22px;width:100%}.roleHero{font-size:76px;margin:auto 0 5px}.roleCopy{font-weight:800;line-height:1.45}.opp .word{margin-top:8px}.word{background:#fff8dd;color:#111;border-radius:12px;padding:12px 25px;margin:14px;font-size:30px;font-weight:1000}.video{height:100%;background:radial-gradient(circle,#5c6670,#182535 58%,#080f17);display:flex;align-items:center;justify-content:center;position:relative}.person{font-size:120px}.reacts{position:absolute;bottom:25px;left:12px;right:12px;background:#07121dcc;border-radius:999px;padding:10px;display:flex;justify-content:space-around;font-size:27px}.watchonly{position:absolute;bottom:25px;left:20px;right:20px;background:#07121dcc;padding:12px;border-radius:12px}.vote{display:flex;gap:8px;align-items:center}.vote .card{flex:1}.vote button{border:0;border-radius:10px;padding:10px;background:#1677e8;color:white;font-weight:900}.vote button.on{background:var(--t);color:#10233a}
.approvedNote{letter-spacing:.2px}.recordScreen{height:100%;background:radial-gradient(circle at 50% 38%,#737b83,#2c3944 48%,#08121c);position:relative;text-align:center}.recTop{position:absolute;top:18px;left:16px;right:16px}.recBars{display:flex;gap:4px}.recBars i{height:4px;background:#ffffff66;flex:1}.recBars i:first-child{background:#fff}.recTimer{margin-top:8px;font-weight:900}.recBody{font-size:140px;padding-top:250px}.recStop{position:absolute;bottom:38px;left:50%;transform:translateX(-50%);width:72px;height:72px;border-radius:50%;border:5px solid #fff;background:#f42e48;box-shadow:0 0 0 4px #0005}.recStop:after{content:"";position:absolute;width:24px;height:24px;border-radius:4px;background:#fff;left:19px;top:19px}.splashChars{position:absolute;left:0;right:0;bottom:0;height:255px}.charBlue{position:absolute;width:175px;height:175px;border-radius:50% 50% 42% 42%;background:#12dce8;left:-34px;bottom:15px;transform:rotate(-8deg)}.charBlue:before{content:"";position:absolute;width:17px;height:23px;border-radius:50%;background:#09234a;left:65px;top:56px;box-shadow:45px 0 #09234a}.charBlue:after{content:"";position:absolute;width:72px;height:40px;border-radius:0 0 60px 60px;background:#09234a;left:48px;top:91px}.charYellow{position:absolute;width:155px;height:155px;border-radius:50%;background:#ffe21e;right:-16px;bottom:37px}.charYellow:before{content:"";position:absolute;width:18px;height:8px;border-radius:10px;background:#122050;left:39px;top:55px;transform:rotate(18deg);box-shadow:56px -3px #122050}.charYellow:after{content:"";position:absolute;width:76px;height:45px;border-radius:0 0 60px 60px;background:#122050;left:40px;top:84px}.spark{position:absolute;color:#ffe21e;font-size:58px;bottom:2px;left:46%;filter:drop-shadow(0 3px #ff9f1a)}</style></head><body><div id="app"><div class="phone" id="phone"></div></div><script src="/socket.io/socket.io.js"></script><script>
const socket=io(),S={screen:"splash",game:null,playerId:localStorage.playerId||null,gameId:localStorage.gameId||null,category:"movies"};const phone=document.getElementById("phone");const brand='<div class="brand">MIMIC<br><b>THIS!</b></div>';
socket.on("game:update",g=>{if(g.me?.id===S.playerId){S.game=g;if(!["home","create"].includes(S.screen))route();render()}});if(S.gameId&&S.playerId)socket.emit("game:resume",{gameId:S.gameId,playerId:S.playerId});
function go(x){S.screen=x;render()}function save(x){S.gameId=x.gameId;S.playerId=x.playerId;localStorage.gameId=x.gameId;localStorage.playerId=x.playerId;S.screen="lobby"}function head(t){return '<div class="top"><span onclick="go(\'home\')" style="font-size:28px">‹</span><b>'+t+'</b><span>⚙</span></div>'}function route(){if(!S.game)return;let s=S.game.status;S.screen=s==="lobby"?"lobby":s==="role"?"role":s==="record"&&S.game.permissions.record?"record":s==="reveal"?"reveal":s==="guess"&&S.game.permissions.guess?"guess":"watch"}
function render(){if(S.screen==="splash"){phone.innerHTML='<div class="splash" onclick="go(\'login\')"><div class="big">MIMIC<br><b>THIS!</b></div><div class="tag">ACT • WATCH • GUESS • LAUGH</div><div class="splashChars"><div class="charBlue"></div><div class="charYellow"></div><div class="spark">★</div></div></div>';return}if(S.screen==="login"){phone.innerHTML='<div class="login">'+brand+'<h3>Play with friends.<br>Anytime. Anywhere.</h3><button class="social" onclick="go(\'home\')"><b style="color:#4285f4;font-size:20px">G</b> &nbsp; Continue with Google</button><button class="social" onclick="go(\'home\')"><b style="color:#1877f2;font-size:21px">●</b> &nbsp; Continue with Facebook</button><button class="social" onclick="go(\'home\')"><b style="font-size:21px">●</b> &nbsp; Continue with Apple</button><button class="social" onclick="go(\'home\')">✉ &nbsp; Continue with Email</button><p class="muted" style="margin-top:16px">By continuing, you agree to our<br>Terms of Service and Privacy Policy.</p><p class="muted" style="margin-top:24px">Already have an account? <b style="color:#12dce8">Sign In</b></p></div>';return}if(S.screen==="join"){phone.innerHTML='<div class="screen">'+head("Join Game")+'<div class="content"><input id="jn" class="input" placeholder="Your name"><input id="jc" class="input" placeholder="Game code"><button class="btn" onclick="join()">Join Game</button></div></div>';return}if(S.screen==="home"){phone.innerHTML='<div class="screen"><div class="top"><span style="font-size:31px">👩🏻</span>'+brand+'<span style="font-size:24px">⚙</span></div><div class="content"><button class="btn" style="font-size:18px" onclick="go(\'create\')">＋ &nbsp; NEW GAME</button><div class="section">Play Again <span style="float:right;color:#12dce8;font-size:12px">See All</span></div><div class="card"><h3 style="margin:0 0 8px">Friday Crew</h3><div style="font-size:28px">👩🏻 👨🏻 👩🏽 <span style="font-size:13px">+3</span><span style="float:right;background:#12dce8;border-radius:12px;padding:9px">▶</span></div><div class="muted">Last played 2 days ago</div></div><div class="section">Friends <span style="float:right;color:#12dce8;font-size:12px">See All</span></div><div style="display:flex;justify-content:space-between;text-align:center;font-size:11px"><span>👩🏻<br>Sarah</span><span>👨🏻<br>John</span><span>👩🏽<br>Maria</span><span>👨🏽<br>David</span><span>●<br>+12</span></div>'+(S.game?'<div class="section">My Games</div><div class="card" onclick="route();render()"><b>'+S.game.name+'</b><div class="muted">'+S.game.status.toUpperCase()+'</div></div>':'')+'</div><div style="position:absolute;bottom:0;left:0;right:0;background:#112942;padding:10px;display:flex;justify-content:space-around;font-size:11px"><span>🏠<br>Home</span><span>👥<br>Friends</span><span>🎮<br>Games</span><span>●<br>Profile</span></div></div>';return}if(S.screen==="create"){phone.innerHTML='<div class="screen">'+head("Create Game")+'<div class="content"><h2 style="margin-top:0">Choose a Category</h2><div class="cats"><div class="cat movies '+(S.category==="movies"?"sel":"")+'" onclick="S.category=\'movies\';render()">🎬 <div><b style="font-size:18px">Movies</b><div style="font-size:12px;font-weight:500">Famous films</div></div></div><div class="cat people '+(S.category==="people"?"sel":"")+'" onclick="S.category=\'people\';render()">⭐ <div><b style="font-size:18px">Famous People</b><div style="font-size:12px;font-weight:500">Actors, singers, athletes...</div></div></div><div class="cat custom '+(S.category==="custom"?"sel":"")+'" onclick="S.category=\'custom\';render()">👥 <div><b style="font-size:18px">Custom</b><div style="font-size:12px;font-weight:500">Your own category</div></div></div></div>'+(S.category==="custom"?'<input id="catname" class="input" value="People We Know">':'')+'<h3>Guessing Time</h3><select id="time" class="input"><option>30 seconds</option><option>1 minute</option><option selected>5 minutes</option><option>15 minutes</option><option>30 minutes</option><option>1 hour</option></select><h3>Invite People</h3><input id="invites" class="input" value="Sarah, John, Maria"><button class="btn" onclick="create()">Create Game</button></div></div>';return}if(S.screen==="lobby"){let g=S.game;phone.innerHTML='<div class="screen">'+head("Game Lobby")+'<div class="content"><div class="card"><h3>'+g.name+'</h3>Code: <b>'+g.code+'</b></div>'+g.players.map(p=>'<div class="card">'+(p.team==="blue"?"🔵":"🟣")+' '+p.name+' <span style="float:right">'+(p.connected?"🟢":"⚪")+'</span></div>').join("")+'<button class="btn" onclick="socket.emit(\'game:start\',{gameId:S.gameId})">Start Game</button></div></div>';return}if(S.screen==="role"){let g=S.game,p=g.permissions;if(p.record){phone.innerHTML='<div class="role actor"><span class="roleClose">×</span>'+brand+'<span class="clapper">🎬</span><div class="avatar">👩🏻</div><h1>YOU ARE THE ACTOR!</h1><div class="word"><div class="wordlabel">Your word is:</div>'+g.turn.word+'</div><div class="only">Act it out using only:</div><div class="acticons"><div><span class="ico">🏃</span>Body<br>movement</div><div><span class="ico">✋</span>Gestures</div><div><span class="ico">😄</span>Facial<br>expressions</div></div><div class="noicons"><div><span class="ico">🚫🗣️</span>No talking</div><div><span class="ico">🚫🔊</span>No sounds</div><div><span class="ico">🚫✍️</span>No writing</div></div><button class="btn" onclick="socket.emit(\'role:ready\',{gameId:S.gameId,playerId:S.playerId})">Start Recording</button></div>';return}if(p.guess){phone.innerHTML='<div class="role team"><span class="roleClose">×</span>'+brand+'<div class="roleHero">👥</div><h1>GUESS THE</h1><div class="word">'+g.categoryName.toUpperCase()+'</div><div class="roleCopy">Watch your teammate’s mime<br>and figure out the word.<br><br>You do NOT know the word.</div><div class="roleHero">🤔</div><button class="btn" onclick="go(\'watch\')">Continue</button></div>';return}phone.innerHTML='<div class="role opp"><span class="roleClose">×</span>'+brand+'<div class="roleHero">🔭</div><h1>ENJOY!</h1><div class="word"><div class="wordlabel">Their word is:</div>'+g.turn.word+'</div><div class="roleCopy">Watch carefully!<br>Don’t give it away!</div><div class="roleHero">😎</div><button class="btn" onclick="go(\'watch\')">Continue</button></div>';return}if(S.screen==="record"){phone.innerHTML='<div class="recordScreen"><div class="recTop"><div class="recBars"><i></i><i></i><i></i></div><div class="recTimer">00:00 / 00:30</div></div><div class="recBody">🧍‍♀️</div><button class="recStop" onclick="socket.emit(\'turn:recorded\',{gameId:S.gameId,playerId:S.playerId,videoLabel:\'Video 1\'})"></button><div style="position:absolute;right:28px;bottom:54px;font-size:28px">🔄</div></div>';return}if(S.screen==="watch"){let g=S.game;phone.innerHTML='<div class="video"><div class="person">💃</div>'+(g.permissions.react?'<div class="reacts">'+["😂","❤️","👏","🔥","😲"].map(e=>'<span onclick="socket.emit(\'reaction:add\',{gameId:S.gameId,playerId:S.playerId,emoji:\''+e+'\'})">'+e+'</span>').join("")+'</div>':'<div class="watchonly">You’re the actor — watch only. No reactions or voting.</div>')+(g.permissions.guess?'<button class="btn" style="position:absolute;top:20px;right:15px;width:auto" onclick="go(\'guess\')">Guess ›</button>':'<button class="btn" style="position:absolute;top:20px;right:15px;width:auto" onclick="socket.emit(\'turn:reveal\',{gameId:S.gameId})">Reveal ›</button>')+'</div>';return}if(S.screen==="guess"){let g=S.game,vals=["Mom","Grandma","Aunt Lisa"];phone.innerHTML='<div class="screen">'+head("Team Blue — Guess Now")+'<div class="content">'+vals.map(v=>'<div class="vote"><div class="card"><b>'+v+'</b></div><button class="'+(g.turn.guesses[S.playerId]===v?"on":"")+'" onclick="socket.emit(\'guess:vote\',{gameId:S.gameId,playerId:S.playerId,answer:\''+v+'\'})">'+(g.turn.guesses[S.playerId]===v?"✓ Your vote":"👍 Vote")+'</button></div>').join("")+'<input id="newguess" class="input" placeholder="Add a different guess"><button class="btn" onclick="socket.emit(\'guess:vote\',{gameId:S.gameId,playerId:S.playerId,answer:document.getElementById(\'newguess\').value})">Use my one vote</button><div class="muted">One vote per player. A new choice moves your existing vote.</div><button class="btn" onclick="socket.emit(\'turn:reveal\',{gameId:S.gameId})">Reveal Answer</button></div></div>';return}if(S.screen==="reveal"){let g=S.game,ok=(g.turn.finalAnswer||"").toLowerCase()===(g.turn.word||"").toLowerCase();phone.innerHTML='<div class="screen">'+head("Round "+g.turn.number)+'<div class="content" style="text-align:center"><h3>THE WORD WAS</h3><div class="word">'+g.turn.word+'</div><h2>'+g.turn.finalAnswer+'</h2><h2>'+(ok?"✓ CORRECT!":"NOT THIS TIME")+'</h2><h2>Blue '+g.scores.blue+' · '+g.scores.purple+' Purple</h2><button class="btn" onclick="socket.emit(\'turn:next\',{gameId:S.gameId})">Next Turn</button></div></div>';return}}
function create(){let invites=document.getElementById("invites").value.split(",").map(x=>x.trim()).filter(Boolean),categoryName=S.category==="custom"?(document.getElementById("catname")?.value||"Custom"):S.category==="movies"?"Movies":"Famous People";socket.emit("game:create",{name:categoryName+" Game",playerName:"Mariano",category:S.category,categoryName,guessingTime:document.getElementById("time").value,invitees:invites},save)}function join(){socket.emit("game:join",{code:document.getElementById("jc").value,name:document.getElementById("jn").value||"Player"},x=>{if(x.error)return alert(x.error);save(x)})}render();
</script></body></html>
