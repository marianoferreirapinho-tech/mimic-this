<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mimic This!</title><style>
:root{--navy:#0b2037;--navy2:#122c49;--purple:#7b22f6;--yellow:#ffe21e;--cyan:#12dce8;--pink:#ff3290;--cream:#fff8e4;--green:#009a58;--red:#d91337}*{box-sizing:border-box}body{margin:0;background:#061424;color:#fff;font-family:Arial Rounded MT Bold,Arial,sans-serif}button,input,select{font:inherit}.phone{width:min(390px,100vw);height:min(844px,100vh);margin:auto;background:linear-gradient(#102b48,#0b2037);overflow:hidden;position:relative}.screen{height:100%;overflow:auto;padding-bottom:72px}.top{height:82px;padding:25px 16px 12px;background:linear-gradient(135deg,#8c31ff,#6420ed);display:flex;align-items:center;justify-content:space-between}.back{font-size:32px;cursor:pointer}.logo{text-align:center;font-weight:1000;line-height:.68;transform:rotate(-5deg);font-size:30px;color:white;text-shadow:2px 3px #22105b}.logo b{color:var(--yellow)}.content{padding:16px}.btn{border:0;border-radius:14px;padding:15px;width:100%;background:var(--cyan);color:#fff;font-size:17px;font-weight:900;margin-top:12px}.btn.purple{background:var(--purple)}.btn.disabled{background:#9298a1;color:#e7e7e7}.card{background:#213d5c;border-radius:15px;padding:14px;margin:10px 0}.input{width:100%;padding:13px;border:0;border-radius:12px;background:white;color:#10233a;margin:6px 0}.muted{font:12px Arial;color:#b9c8d7}.section{font-size:20px;margin-top:20px}.category{height:82px;border-radius:14px;padding:13px;display:flex;align-items:center;gap:13px;margin:10px 0}.movies{background:linear-gradient(135deg,#7b22f6,#a235ff)}.people{background:linear-gradient(135deg,#ffd91a,#ffe74e);color:#0b2037}.custom{background:linear-gradient(135deg,#08cfd9,#19e6ec);color:#0b2037}.catIcon{font-size:38px}.splash{height:100%;position:relative;text-align:center;padding-top:100px;background:radial-gradient(circle at 13% 2%,#a344ff 0 13%,transparent 14%),radial-gradient(circle at 88% 25%,#a03cff 0 17%,transparent 18%),linear-gradient(150deg,#7924f5,#901cff 62%,#6d18e6)}.splashLogo{font-size:68px;line-height:.76;letter-spacing:-5px;-webkit-text-stroke:7px #29116a;paint-order:stroke fill;filter:drop-shadow(0 7px #29116a);transform:rotate(-4deg)}.splashLogo b{color:var(--yellow)}.tag{margin-top:72px;font-weight:900}.chars{position:absolute;bottom:0;left:0;right:0;height:250px}.blueFace,.yellowFace{position:absolute;border-radius:50%}.blueFace{width:180px;height:180px;background:var(--cyan);left:-36px;bottom:12px}.yellowFace{width:158px;height:158px;background:var(--yellow);right:-18px;bottom:36px}.star{position:absolute;font-size:60px;color:var(--yellow);left:46%;bottom:5px}.login{height:100%;text-align:center;padding:72px 20px;background:linear-gradient(#122b48,#0b2037)}.login .logo{font-size:58px;margin-bottom:38px}.social{width:100%;padding:13px;margin:6px 0;border:0;border-radius:12px;background:#fff;color:#111;font-weight:800}.friends{display:flex;justify-content:space-between;text-align:center;font:11px Arial}.avatar{width:40px;height:40px;border-radius:50%;background:#e4b38e;margin:auto;border:2px solid #fff}.role{height:100%;padding:14px 18px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;position:relative}.actor{background:linear-gradient(155deg,#ffe62e,#ffd319);color:#101d38}.teammate{background:linear-gradient(155deg,#12dce8,#08c9df);color:#08234a}.opponent{background:linear-gradient(155deg,#ff439c,#ff2483)}.role .logo{font-size:34px}.heroIcon{font-size:78px;margin:26px 0 8px}.role h1{font-size:28px;margin:8px 0}.word{background:var(--cream);color:#0a1f40;border-radius:13px;padding:12px 18px;width:100%;font-size:28px;font-weight:1000}.word small{display:block;font:12px Arial}.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;width:100%;margin-top:12px;font-size:11px;font-weight:800}.ruleIcon{font-size:28px}.role .btn{margin-top:auto}.think{font-size:96px;margin-top:auto}.record{height:100%;position:relative;background:radial-gradient(circle at 50% 38%,#899097,#303d48 48%,#08131d);text-align:center}.recTop{padding:22px 16px}.bars{display:flex;gap:4px}.bars i{height:4px;flex:1;background:#ffffff55}.bars i.on{background:white}.person{font-size:150px;margin-top:185px}.recordControls{position:absolute;bottom:30px;left:20px;right:20px}.recordDot{width:74px;height:74px;border:5px solid #fff;border-radius:50%;background:#f32f4b;margin:auto}.uploaded{height:100%;padding:90px 20px 25px;text-align:center;background:linear-gradient(#102b48,#0b2037)}.uploaded .check{font-size:80px}.watch{height:100%;position:relative;background:radial-gradient(circle,#66737d,#24323e 55%,#07111a);text-align:center}.watchHead{position:absolute;top:18px;left:14px;right:14px}.watchPerson{font-size:150px;padding-top:290px}.reactions{position:absolute;bottom:24px;left:12px;right:12px;background:#06121dcc;border-radius:999px;padding:11px;display:flex;justify-content:space-around;font-size:27px}.waiting{height:100%;text-align:center;padding:70px 20px 22px;display:flex;flex-direction:column;align-items:center}.waiting.movies{color:white}.waiting.people,.waiting.custom{color:#0a1f40}.waiting .logo{font-size:35px}.waiting .heroIcon{margin-top:70px}.waiting h2{margin-top:25px}.waiting .btn{margin-top:auto}.guessHead{padding:22px 15px 14px;text-align:center}.guessHead.movies{color:#fff}.guessHead.people,.guessHead.custom{color:#0a1f40}.timer{float:right;background:#10233a;color:#fff;padding:7px 12px;border-radius:10px}.guessBody{padding:14px}.guessRow{display:flex;align-items:center;gap:8px;background:#18344f;border:1px solid #42617d;border-radius:12px;padding:10px;margin:8px 0}.guessRow.selected{outline:2px solid var(--cyan)}.count{width:27px;height:27px;border-radius:50%;background:var(--purple);display:grid;place-items:center}.voteBtn{margin-left:auto;border:0;border-radius:9px;padding:8px 10px;background:#1478e9;color:#fff}.result{height:100%;padding:26px 20px 20px;text-align:center;display:flex;flex-direction:column;align-items:center}.correct{background:radial-gradient(circle at 50% 37%,#15c56d,#00723f 52%,#00452d)}.incorrect{background:radial-gradient(circle at 50% 37%,#ff3857,#c20f32 52%,#7d0825)}.result .logo{font-size:35px}.result .heroIcon{margin:34px 0 5px}.result h1{font-size:42px;margin:8px 0;text-shadow:0 4px #0005}.answer{background:#fff;color:#0a1f40;border-radius:18px;padding:12px 22px;width:100%;font-size:23px}.score{font-size:34px;color:var(--yellow);margin:20px 0}.result .btn{margin-top:auto;color:#071c39}.homeNav{position:absolute;bottom:0;left:0;right:0;height:64px;background:#112942;display:flex;justify-content:space-around;align-items:center;font:11px Arial;text-align:center}
.approvedSplash{height:100%;width:100%;background:#6517f5;cursor:pointer;overflow:hidden}.approvedSplash img{width:100%;height:100%;object-fit:cover;display:block}</style></head><body><div class="phone" id="phone"><div class="approvedSplash"><img src="/screen1-approved.jpg" alt="Mimic This!"></div><script src="/socket.io/socket.io.js"></script><script>
const phone=document.getElementById("phone"),socket=(typeof io==="function"?io():{on(){},emit(){}}),S={screen:"splash",game:null,gameId:localStorage.gameId||null,playerId:localStorage.playerId||null,category:"movies",customName:"People We Know",customWords:["Mom","Dad","Grandma","Uncle John"],selected:null,recording:false};
const logo='<div class="logo">MIMIC<br><b>THIS!</b></div>';
function go(x){S.screen=x;render()} function save(x){S.gameId=x.gameId;S.playerId=x.playerId;localStorage.gameId=x.gameId;localStorage.playerId=x.playerId;S.screen="lobby"}
function top(t){return '<div class="top"><span class="back" onclick="go(\'home\')">‹</span><b>'+t+'</b><span>⚙</span></div>'}
function catClass(g=S.game){return g?.category||S.category} function catIcon(g=S.game){return (g?.category||S.category)==="movies"?"🎬":(g?.category||S.category)==="people"?"★":"👥"} function catLabel(g=S.game){return g?.category==="custom"?(g.categoryName||"Custom"):g?.categoryMeta?.label||((g?.category||S.category)==="movies"?"Movies":"Famous People")}
socket.on("game:update",g=>{if(g.me?.id===S.playerId){S.game=g;if(!["home","create","customsetup","words"].includes(S.screen))route();render()}});if(S.gameId&&S.playerId)socket.emit("game:resume",{gameId:S.gameId,playerId:S.playerId});
function route(){if(!S.game)return;const g=S.game;if(g.status==="lobby")S.screen="lobby";else if(g.status==="role")S.screen="role";else if(g.status==="record")S.screen=g.permissions.record?"record":"waitingVideo";else if(g.status==="watch")S.screen="watch";else if(g.status==="guess")S.screen=g.permissions.guess?(g.permissions.submitted?"waitingGuess":"guess"):"waitingGuess";else if(g.status==="reveal")S.screen="reveal";else if(g.status==="gameover")S.screen="gameover"}
function render(){
 if(S.screen==="splash"){phone.innerHTML="<div class='approvedSplash' onclick='go(&quot;login&quot;)'><img src='/screen1-approved.jpg' alt='Mimic This!'></div>";return}
 if(S.screen==="login"){phone.innerHTML='<div class="login">'+logo+'<h3>Play with friends.<br>Anytime. Anywhere.</h3><button class="social" onclick="go(\'home\')">🌐 &nbsp; Continue with Google</button><button class="social" onclick="go(\'home\')">● &nbsp; Continue with Facebook</button><button class="social" onclick="go(\'home\')">● &nbsp; Continue with Apple</button><button class="social" onclick="go(\'home\')">✉ &nbsp; Continue with Email</button><p class="muted">By continuing, you agree to our<br>Terms of Service and Privacy Policy.</p><p class="muted">Already have an account? <b style="color:#12dce8">Sign In</b></p></div>';return}
 if(S.screen==="home"){phone.innerHTML='<div class="screen"><div class="top"><div class="avatar"></div>'+logo+'<span>⚙</span></div><div class="content"><button class="btn" onclick="go(\'create\')">＋ &nbsp; NEW GAME</button><div class="section">Play Again <span class="muted" style="float:right;color:#12dce8">See All</span></div><div class="card"><b>Friday Crew</b><div style="font-size:28px;margin-top:8px">● ● ● <span class="muted">+3</span><span style="float:right;background:#12dce8;padding:8px;border-radius:12px">▶</span></div><div class="muted">Last played 2 days ago</div></div><div class="section">Friends <span class="muted" style="float:right;color:#12dce8">See All</span></div><div class="friends"><span><div class="avatar"></div>Sarah</span><span><div class="avatar"></div>John</span><span><div class="avatar"></div>Maria</span><span><div class="avatar"></div>David</span><span><div class="avatar">+12</div></span></div>'+(S.game?'<div class="section">Your Games</div><div class="card" onclick="route();render()"><b>'+S.game.name+'</b><div class="muted">'+S.game.status.toUpperCase()+'</div></div>':'')+'</div><div class="homeNav"><span>⌂<br>Home</span><span>♟<br>Friends</span><span>▣<br>Games</span><span>●<br>Profile</span></div></div>';return}
 if(S.screen==="create"){phone.innerHTML='<div class="screen">'+top("Create Game")+'<div class="content"><h3>Choose a Category</h3><div class="category movies" onclick="S.category=\'movies\';render()"><span class="catIcon">🎬</span><div><b>Movies</b><div class="muted">Famous films</div></div></div><div class="category people" onclick="S.category=\'people\';render()"><span class="catIcon">★</span><div><b>Famous People</b><div>Actors, singers, athletes...</div></div></div><div class="category custom" onclick="S.category=\'custom\';render()"><span class="catIcon">👥</span><div><b>Custom</b><div>Your own category</div></div></div><h4>Guessing Time</h4><select id="time" class="input"><option>30 seconds</option><option>1 minute</option><option selected>5 minutes</option></select><h4>Invite People</h4><input id="invites" class="input" value="Sarah, John, Maria"><button class="btn" onclick="nextCreate()">Next</button></div></div>';return}
 if(S.screen==="customsetup"){phone.innerHTML='<div class="screen">'+top("Custom Category")+'<div class="content"><h4>Give your category a name</h4><input id="customName" class="input" value="'+S.customName+'"><h3>Now everyone adds their words</h3><p>🔒 &nbsp; Add words privately</p><p>◉ &nbsp; You won’t see others’ words</p><p>⏱ &nbsp; Duplicates are allowed</p><button class="btn" onclick="S.customName=document.getElementById(\'customName\').value;go(\'words\')">Start Adding</button></div></div>';return}
 if(S.screen==="words"){phone.innerHTML='<div class="screen">'+top("Add Your Words")+'<div class="content" style="text-align:center"><div class="muted">Add words for the category:</div><div class="card" style="display:inline-block">'+S.customName+'</div><div style="display:flex;gap:6px"><input id="wordInput" class="input" placeholder="Type a word..."><button class="btn" style="width:55px;margin:6px 0" onclick="addWord()">＋</button></div>'+S.customWords.map((w,i)=>'<div class="card" style="text-align:left">'+w+'<span style="float:right" onclick="S.customWords.splice('+i+',1);render()">×</span></div>').join("")+'<p class="muted">You can add as many as you like.</p><button class="btn" onclick="create()">Done</button></div></div>';return}
 if(S.screen==="lobby"){const g=S.game,blue=g.players.filter(p=>p.team==="blue"),purple=g.players.filter(p=>p.team==="purple");phone.innerHTML='<div class="screen">'+top("Game Lobby")+'<div class="content"><div class="card"><b>'+g.name+'</b><span style="float:right">⌯</span><div class="muted">Code: '+g.code+'</div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><b style="color:#21b6ff">Team Blue ('+blue.length+')</b>'+blue.map(p=>'<div class="card">'+p.name+'</div>').join("")+'</div><div><b style="color:#c262ff">Team Purple ('+purple.length+')</b>'+purple.map(p=>'<div class="card">'+p.name+'</div>').join("")+'</div></div><button class="btn" onclick="socket.emit(\'game:start\',{gameId:S.gameId})">Start Game</button></div></div>';return}
 if(S.screen==="role"){const g=S.game,p=g.permissions;if(p.record){phone.innerHTML='<div class="role actor"><span class="back" style="position:absolute;left:14px">×</span>'+logo+'<div class="heroIcon">🎬</div><h1>YOU ARE THE ACTOR!</h1><div class="word"><small>Your word is:</small>'+g.turn.word+'</div><b>Act it out using only:</b><div class="rules"><div><div class="ruleIcon">🏃</div>Body<br>movement</div><div><div class="ruleIcon">✋</div>Gestures</div><div><div class="ruleIcon">☺</div>Facial<br>expressions</div><div><div class="ruleIcon">🚫</div>No talking</div><div><div class="ruleIcon">🔇</div>No sounds</div><div><div class="ruleIcon">✎</div>No writing</div></div><button class="btn purple" onclick="socket.emit(\'role:ready\',{gameId:S.gameId,playerId:S.playerId})">Start Recording</button></div>';return}if(p.guess){phone.innerHTML=roleGuess(g,false);return}phone.innerHTML='<div class="role opponent"><span class="back" style="position:absolute;left:14px">×</span>'+logo+'<div class="heroIcon">◉◉</div><h1>ENJOY!</h1><div class="word"><small>Their word is:</small>'+g.turn.word+'</div><h3>Watch carefully!<br>Don’t give it away!</h3><div class="think">😎</div><button class="btn disabled">Waiting for Videos</button></div>';return}
 if(S.screen==="waitingVideo"){phone.innerHTML=roleGuess(S.game,true);return}
 if(S.screen==="record"){const n=(S.game.turn.videos||[]).length+1;if(n>3){phone.innerHTML=uploaded();return}phone.innerHTML='<div class="record"><div class="recTop"><div class="bars"><i class="on"></i><i></i><i></i></div><b>Video '+n+' / 3 &nbsp; 00:30</b></div><div class="person">🧍‍♀️</div><div class="recordControls"><button class="recordDot" onclick="recordDone('+n+')"></button></div></div>';return}
 if(S.screen==="uploaded"){phone.innerHTML=uploaded();return}
 if(S.screen==="watch"){const g=S.game;phone.innerHTML='<div class="watch"><div class="watchHead"><div class="bars"><i class="on"></i><i></i><i></i></div><b>'+g.turn.actorName+'’s Mime &nbsp; Video 1 / '+Math.max(1,g.turn.videos.length)+'</b></div><div class="watchPerson">💃</div>'+(g.permissions.react?'<div class="reactions">'+["😂","❤️","👏","🔥","😲"].map(e=>'<span onclick="socket.emit(\'reaction:add\',{gameId:S.gameId,playerId:S.playerId,emoji:\''+e+'\'})">'+e+'</span>').join("")+'</div>':'')+'<button style="display:none" id="watchDone" onclick="socket.emit(\'watch:done\',{gameId:S.gameId})"></button></div>';setTimeout(()=>document.getElementById("watchDone")?.click(),2200*Math.max(1,g.turn.videos.length));return}
 if(S.screen==="guess"){const g=S.game,counts={};Object.values(g.turn.guesses||{}).forEach(v=>counts[v]=(counts[v]||0)+1);let vals=Object.keys(counts);if(!vals.length)vals=g.category==="movies"?["Toy Story","The Incredibles"]:g.category==="people"?["Taylor Swift","Beyoncé"]:["Yoga","Cooking"];phone.innerHTML='<div class="screen"><div class="guessHead '+catClass(g)+'"><span class="back" style="float:left">‹</span>'+logo+'<span class="timer">00:30</span><div class="category '+catClass(g)+'" style="height:38px;justify-content:center;margin:8px auto 0;width:70%;padding:5px">'+catIcon(g)+' '+catLabel(g)+'</div></div><div class="guessBody"><h3 style="text-align:center">What do you think<br>they were mimicking?</h3><div class="muted" style="text-align:center">Team guesses so far — vote or type yours</div>'+vals.map(v=>'<div class="guessRow '+(S.selected===v?"selected":"")+'" onclick="S.selected='+JSON.stringify(v)+';render()"><span class="count">'+(counts[v]||0)+'</span><b>'+v+'</b><button class="voteBtn">'+(S.selected===v?"✓":"Vote")+'</button></div>').join("")+'<input id="ownGuess" class="input" placeholder="Type your guess..." oninput="S.selected=this.value"><button class="btn" onclick="submitGuess()">Submit My Guess</button><div class="muted" style="text-align:center;margin-top:8px">One guess per player.</div></div></div>';return}
 if(S.screen==="waitingGuess"){phone.innerHTML=waitingGuess();return}
 if(S.screen==="reveal"){phone.innerHTML=resultScreen();return}
 if(S.screen==="gameover"){phone.innerHTML='<div class="screen">'+top("Game Over")+'<div class="content" style="text-align:center;padding-top:90px"><h1>🏆</h1><h1>Game Complete!</h1><div class="word">Blue '+S.game.scores.blue+' · '+S.game.scores.purple+' Purple</div><button class="btn" onclick="go(\'home\')">Back to Home</button></div></div>';return}
}
function roleGuess(g,waiting){const c=catClass(g),ready=g.status==="watch";return '<div class="role teammate '+c+'"><span class="back" style="position:absolute;left:14px">‹</span>'+logo+'<div class="heroIcon">'+catIcon(g)+'</div><h1>GUESS THE</h1><div class="word">'+catLabel(g).toUpperCase()+'</div><h3>Watch your teammate’s mime<br>and figure out the word.</h3><div class="think">🤔</div><button class="btn '+(ready?"":"disabled")+'" '+(ready?'onclick="go(\'watch\')"':'')+'>'+(ready?"Watch Videos":"Waiting for Videos")+'</button></div>'}
function uploaded(){const n=S.game.turn.videos.length;return '<div class="uploaded"><div class="check">✓</div><h1>Video '+n+' uploaded!</h1><p>What was recorded is uploaded.</p>'+(n<3?'<button class="btn purple" onclick="go(\'record\')">Record Video '+(n+1)+'</button>':'')+'<button class="btn" onclick="socket.emit(\'recording:finish\',{gameId:S.gameId,playerId:S.playerId})">Finish Turn</button></div>'}
function waitingGuess(){const g=S.game;return '<div class="waiting '+catClass(g)+'">'+logo+'<div class="heroIcon">'+catIcon(g)+'</div><h2>Wait for your teammates to finish guessing the mimic!</h2><button class="btn" onclick="go(\'home\')">⌂ &nbsp; Back to Home</button></div>'}
function resultScreen(){const g=S.game,ok=g.turn.result==="correct",c=ok?"correct":"incorrect";return '<div class="result '+c+'">'+logo+'<div class="category '+catClass(g)+'" style="height:42px;width:70%;justify-content:center">'+catIcon(g)+' <b>'+catLabel(g)+'</b></div><div class="heroIcon">'+catIcon(g)+'</div><h1>'+(ok?"CORRECT!":"NOT THIS TIME")+'</h1><b>Your team guessed:</b><div class="answer">'+(g.turn.finalAnswer||"—")+'</div>'+(!ok?'<b style="margin-top:14px">The correct answer was:</b><div class="answer">'+g.turn.word+'</div>':'')+'<div class="score">'+(ok?"+1 POINT":"+0 POINTS")+'</div><button class="btn" onclick="go(\'home\')">⌂ &nbsp; Back to Home</button></div>'}
function recordDone(n){socket.emit("turn:recorded",{gameId:S.gameId,playerId:S.playerId,videoLabel:"Video "+n});S.screen="uploaded";setTimeout(render,100)}
function submitGuess(){const typed=document.getElementById("ownGuess")?.value.trim();const ans=typed||S.selected;if(!ans)return;socket.emit("guess:submit",{gameId:S.gameId,playerId:S.playerId,answer:ans})}
function nextCreate(){if(S.category==="custom"){go("customsetup")}else create()} function addWord(){const e=document.getElementById("wordInput"),v=e.value.trim();if(v){S.customWords.push(v);render()}}
function create(){const inv=document.getElementById("invites"),time=document.getElementById("time");const invites=inv?inv.value.split(",").map(x=>x.trim()).filter(Boolean):["Sarah","John","Maria"],categoryName=S.category==="custom"?S.customName:S.category==="movies"?"Movies":"Famous People";socket.emit("game:create",{name:categoryName+" Game",playerName:"You",category:S.category,categoryName,guessingTime:time?.value||"30 seconds",invitees:invites,customWords:S.customWords},save)}
render();
</script></body></html>
